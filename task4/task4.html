<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h2 style="margin: 10px;">Registration form </h2>
    <div class="container" m-4>
        <form class="was-validated">
            <div class="row">
                <label class="col-2" for="name">Name</label>
                <input class="col-4" type="text" required>
                
                <label class="col-2" for="surname">Last Name</label>
                <input class="col-4" type="text" required>
            </div>
            <br>
             <div class="row">
                <div class="col-12">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" id="email" required>
                    <div class="valid-feedback">Valid email!</div>
                    <div class="invalid-feedback">Enter a valid email.</div>
                </div>
            </div>
            <br>
              <div class="row">
                <div class="col-6">
                    <label for="password">Password</label>
                    <input class="form-control" type="password" id="password" minlength="8" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Minimum 8 characters.</div>
                </div>

                <div class="col-6">
                    <label for="confirm">Confirm Password</label>
                    <input class="form-control" type="password" id="confirm" minlength="8" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Confirm your password.</div>
                </div>
            </div>
            <br>
            <br>
            <div class="row">
                <div class="col-4">
                    <label><b>Hobbies:</b></label>
                    <br>
                    <input type="checkbox" id="music">
                    <label for="music">Music</label>

                    <input type="checkbox" id="sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="games">
                    <label for="games">Games</label>
                </div>
                <div class="col-4">
                    <div>
                        <label><b>Gender</b></label>
                        <br>
                        <input type="radio" name="gender" id="male" required>
                        <label for="male">Male</label>

                        <input type="radio" name="gender" id="female">
                        <label for="female">Female</label>
                    </div>
                </div>
                <div class="col-4">
                    <label for="country"><b>Country</b></label>
                    <select class="form-select" id="country" required>
                        <option value="">Choose country</option>
                        <option value="kz">Kazakhstan</option>
                        <option value="us">USA</option>
                        <option value="uk">UK</option>
                    </select>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Select a country.</div>
                </div>
            <br>
            <br>
            <br>


            <button class="btn btn-primary" type="submit">SEND DATA</button>
            <button class="btn btn-danger" type="reset">RESET</button>
        </form>
    </div>
</body>
</html>
