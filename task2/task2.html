<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h2 class="m-4">REGGISTRATION FORM</h2>
    <p class="m-4"style="color: red;"><b>You need to fill everything</b></p>
    


    <div class="container">
        <form class="row">
            
            <div style="background-color: gray;" class="p-4 col-6">
                <label for="text">Name: </label>  
                <input type="text" id="text" placeholder="more than 3 letters" required minlength="3" maxlength="20">
            </div>

            <div style="background-color: gray;" class="p-4 col-6">
                <label for="email">Email:</label>
                <input type="email" placeholder="do not forget '@'" required>
            </div>

            <div style="display: flex; justify-content: center;" class="mt-4">
                <input style="width: 200px; height: 50px;" type="submit">
            </div>
        </form>
    </div>
</body>
</html>
